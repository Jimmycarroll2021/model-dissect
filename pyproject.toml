[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimind-re"
version = "0.1.1"
description = "Source-assisted transformer dissection research workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "numpy"]

[project.optional-dependencies]
reference = ["transformers", "tokenizers", "safetensors", "jinja2"]
test = ["pytest", "transformers", "safetensors"]
plots = ["matplotlib"]

[project.scripts]
model-dissect = "minimind_re.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
